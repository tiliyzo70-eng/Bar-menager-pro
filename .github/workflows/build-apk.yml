Në rregull! Bëje në browser (Chrome/Safari) - është më e lehtë! Ja çfarë të bësh hap pas hapi:

📱 Hapat në Browser (Chrome/Safari)
Hapi 1: Hape GitHub në Browser
Hap Chrome ose Safari në telefon
Shkruaj në adresë: github.com
Kliko "Sign in" (nëse ke llogari) ose "Sign up" (nëse s'ke)
Hyni në llogari
Hapi 2: Krijo Repository (Magazinën)
Kliko butonin "+" (lart djathtas, pranë ftyrës tënde)
Zgjidh "New repository"
Shkruaj te "Repository name": barmanager
Te "Description" (opsional): Bar Kafe Manager
MOS e prek asnjë checkbox (veç nëse do të inicosh me README, por më mirë jo)
Kliko butonin e gjelbër "Create repository"
Hapi 3: Krijo Skedarët (3 Skedarë)
Pasi të krijosh repository, do të shohësh faqe që thotë:

"Quick setup — if you've done this kind of thing before"

Skedar 1: Workflow për Build
Kliko linkun "creating a new file" (teksti blu në mes të faqes)
Lart ku shkruan "Name your file...", shkruaj saktësisht:
text

.github/workflows/build-apk.yml
Poshtë në kutinë e madhe, kopjo KËTË kod:
YAML

name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: npm install
    
    - name: Build project
      run: npm run build
    
    - name: Setup Capacitor
      run: |
        npm install @capacitor/core @capacitor/cli
        npx cap add android
    
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'
    
    - name: Build APK
      run: |
        cd android
        ./gradlew assembleDebug
    
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
